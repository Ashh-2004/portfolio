      <stop stop-color="#181B28"/>
      <stop offset="1" stop-color="#0B0D13"/>
    </linearGradient>
    <linearGradient id="accent_grad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#FB923C"/>
