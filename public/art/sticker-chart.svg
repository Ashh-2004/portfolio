<svg width="140" height="130" viewBox="0 0 140 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Die-cut Backing -->
  <rect x="8" y="8" width="124" height="114" rx="20" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
  <!-- Lavender Body -->
  <rect x="14" y="14" width="112" height="102" rx="16" fill="#e9ccff" stroke="#000000" stroke-width="1.5" />
  
  <!-- Axis Line -->
  <line x1="28" y1="94" x2="112" y2="94" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- 3 Rising Bars -->
  <!-- Bar 1: Electric Blue -->
  <rect x="34" y="60" width="18" height="34" rx="4" fill="#4da2ff" stroke="#000000" stroke-width="2" />
  <!-- Bar 2: Sunburst -->
  <rect x="60" y="44" width="18" height="50" rx="4" fill="#ffd731" stroke="#000000" stroke-width="2" />
  <!-- Bar 3: Mint Pop -->
  <rect x="86" y="28" width="18" height="66" rx="4" fill="#55db9c" stroke="#000000" stroke-width="2" />

  <!-- Trend Arrow -->
  <path d="M 38 46 L 68 32 L 96 18" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 88 18 L 96 18 L 96 26" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
